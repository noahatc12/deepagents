[project]
name = "quant-research-agent"
version = "0.1.0"
description = "Quantitative finance research agent with factor analysis, backtesting, and risk assessment"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.3.5,<0.6.0",
    "langchain>=1.2.3",
    "langchain-anthropic>=1.3.1",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "yfinance>=0.2.30",
    "rich>=13.0",
]
